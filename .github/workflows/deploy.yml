name: Deploy Sara Textile ERP to Plesk Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🚀 Build & Deploy to Hostinger VPS
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies & Generate Prisma
        run: |
          npm ci
          npx prisma generate

      - name: 🏗️ Build Next.js Production Bundle
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🚀 Deploy to Plesk VPS via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # Detect target directory on Plesk
          REMOTE_LIST=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ssl:verify-certificate false; set ftp:ssl-allow true; set ftp:prefer-epsv false; set net:timeout 20; ls; quit" "$FTP_SERVER" 2>&1 || true)
          
          if echo "$REMOTE_LIST" | grep -q "httpdocs"; then
            TARGET_DIR="/httpdocs"
          else
            TARGET_DIR="/"
          fi
          
          echo "Deploying to remote target: $TARGET_DIR"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
            set ssl:verify-certificate false
            set ftp:ssl-allow true
            set ftp:passive-mode true
            set ftp:prefer-epsv false
            set net:timeout 60
            set net:max-retries 10
            set net:reconnect-interval-base 3
            mirror --reverse --delete --verbose --parallel=2 \
              --exclude-glob .git* \
              --exclude-glob node_modules* \
              --exclude-glob .next/cache* \
              --exclude-glob *.zip \
              --exclude-glob *.log \
              --exclude-glob .env* \
              ./ "\$TARGET_DIR"
            quit
          EOF
