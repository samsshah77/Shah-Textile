name: Deploy Sara Textile ERP to Plesk Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: ⚡ Build & Deploy (< 45s)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies & Generate Prisma
        run: |
          npm ci
          npx prisma generate

      - name: 🏗️ Build Next.js Production Bundle
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🗜️ Package Single Deployment Bundle
        run: |
          # Remove cache to keep archive lightweight
          rm -rf .next/cache
          zip -r -q sara-build.zip .next public server.js package.json package-lock.json next.config.ts tsconfig.json prisma prisma.config.ts

      - name: 🚀 Upload Bundle to Plesk via Node.js
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          node scripts/deploy-ftp.js

      - name: ⚡ Trigger Instant Server Unpack & Restart
        run: |
          echo "Triggering live unpack..."
          UNPACK_RESPONSE=$(curl -s -k "https://saratextilesweaving.com/deploy-unpack.php?key=sara_deploy_secret_key_2026" || curl -s -k "http://72.62.255.78/deploy-unpack.php?key=sara_deploy_secret_key_2026" || true)
          echo "Server Response: $UNPACK_RESPONSE"
