name: Deploy Sara Textile ERP to Plesk Production

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: ⚡ Fast Build & Deploy (Under 1 Min)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies & Generate Prisma
        run: |
          npm ci
          npx prisma generate

      - name: 🏗️ Build Next.js Production Bundle
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🗜️ Package Single Deployment Bundle
        run: |
          # Strip build cache to keep package lightweight (~15MB)
          rm -rf .next/cache
          zip -r -q sara-build.zip .next public server.js package.json package-lock.json next.config.ts tsconfig.json prisma prisma.config.ts deploy-unpack.php

      - name: 🚀 Upload Bundle to Plesk VPS via LFTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          REMOTE_LIST=$(lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -e "set ssl:verify-certificate false; set ftp:ssl-allow true; set ftp:prefer-epsv false; set net:timeout 15; ls; quit" "$FTP_SERVER" 2>&1 || true)
          
          if echo "$REMOTE_LIST" | grep -q "httpdocs"; then
            TARGET_DIR="/httpdocs"
          else
            TARGET_DIR="/"
          fi
          
          echo "Uploading single build package to: $TARGET_DIR"

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER" <<EOF
            set ssl:verify-certificate false
            set ftp:ssl-allow true
            set ftp:passive-mode true
            set ftp:prefer-epsv false
            set net:timeout 60
            set net:max-retries 5
            put -O "\$TARGET_DIR" sara-build.zip
            put -O "\$TARGET_DIR" deploy-unpack.php
            quit
          EOF

      - name: ⚡ Unpack & Restart Production Server (< 1s)
        run: |
          echo "Triggering server unpack hook..."
          UNPACK_RESULT=$(curl -s -k "https://saratextilesweaving.com/deploy-unpack.php?key=sara_deploy_secret_key_2026" || curl -s -k "http://72.62.255.78/deploy-unpack.php?key=sara_deploy_secret_key_2026" || true)
          echo "Result: $UNPACK_RESULT"
