name: Deploy Sara Textile ERP to Plesk Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: ⚡ Fast Production Build & Deploy (< 45s)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Dependencies & Generate Prisma
        run: |
          npm ci
          npx prisma generate

      - name: 🏗️ Build Production Bundle
        run: |
          npm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

      - name: 🗜️ Package Standalone Production Archive
        run: |
          # Copy static and public assets into standalone directory
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp -r prisma .next/standalone/prisma

          # Ensure production server.js exists in standalone root
          if [ -f server.js ]; then
            cp server.js .next/standalone/server.js
          fi

          # Archive only the standalone distribution (Ultra-lightweight ~25 MB!)
          cd .next/standalone
          zip -r -q ../../sara-build.zip .
          cd ../..

          echo "Archive generated successfully:"
          ls -lh sara-build.zip

      - name: 🚀 Transfer & Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST || secrets.FTP_SERVER }}
          SSH_USER: ${{ secrets.SSH_USER || 'root' }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          TARGET_HOST=$(echo "$SSH_HOST" | tr -d '\r\n "'\''')
          TARGET_USER=$(echo "$SSH_USER" | tr -d '\r\n "'\''')

          mkdir -p ~/.ssh
          ssh-keyscan -p 22 "$TARGET_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          KEY_VALID=false
          if [ -n "$SSH_KEY" ]; then
            printf "%s\n" "$SSH_KEY" > ~/.ssh/deploy_key
            sed -i 's/\r$//' ~/.ssh/deploy_key
            echo "" >> ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            if ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null 2>&1; then
              KEY_VALID=true
              echo "✅ Valid SSH Key verified!"
            else
              echo "⚠️ SSH Key invalid format or public key provided. Will attempt Password..."
            fi
          fi

          if [ "$KEY_VALID" = true ]; then
            echo "🚀 Connecting as '$TARGET_USER' to '$TARGET_HOST' using SSH Key..."
            scp -P 22 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no sara-build.zip server.js "${TARGET_USER}@${TARGET_HOST}:/var/www/vhosts/saratextilesweaving.com/httpdocs/"
            ssh -p 22 -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no "${TARGET_USER}@${TARGET_HOST}" "
              cd /var/www/vhosts/saratextilesweaving.com/httpdocs
              unzip -o -q sara-build.zip
              rm -f sara-build.zip
              mkdir -p tmp
              touch tmp/restart.txt
              echo '✅ Production build successfully unpacked and Passenger restarted!'
            "
          elif [ -n "$SSH_PASS" ]; then
            echo "🔑 Connecting as '$TARGET_USER' to '$TARGET_HOST' using Password (sshpass)..."
            sshpass -p "$SSH_PASS" scp -P 22 -o StrictHostKeyChecking=no sara-build.zip server.js "${TARGET_USER}@${TARGET_HOST}:/var/www/vhosts/saratextilesweaving.com/httpdocs/"
            sshpass -p "$SSH_PASS" ssh -p 22 -o StrictHostKeyChecking=no "${TARGET_USER}@${TARGET_HOST}" "
              cd /var/www/vhosts/saratextilesweaving.com/httpdocs
              unzip -o -q sara-build.zip
              rm -f sara-build.zip
              mkdir -p tmp
              touch tmp/restart.txt
              echo '✅ Production build successfully unpacked and Passenger restarted!'
            "
          else
            echo "❌ ERROR: Neither a valid SSH Key nor Password was found!"
            exit 1
          fi

      - name: 🔐 Sync live RBAC permissions (accountant / roles)
        run: |
          sleep 8
          SEED_RESPONSE=$(curl -s -k "https://saratextilesweaving.com/api/auth/seed?key=sara_deploy_secret_key_2026" || true)
          echo "Seed Response: $SEED_RESPONSE"

      - name: 🏭 Create floor/payroll tables then seed live data
        run: |
          sleep 8
          ENSURE=$(curl -s -k "https://saratextilesweaving.com/api/db/ensure-floor?key=sara_deploy_secret_key_2026" || true)
          echo "Ensure tables: $ENSURE"
          FLOOR_RESPONSE=$(curl -s -k "https://saratextilesweaving.com/api/floor/store" || true)
          echo "Floor bootstrap: $FLOOR_RESPONSE"
          PAYROLL=$(curl -s -k "https://saratextilesweaving.com/api/payroll/store" || true)
          echo "Payroll bootstrap: $PAYROLL"
